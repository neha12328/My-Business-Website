<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body class="dashboard-page">

    <div class="dashboard-layout">

        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-brand">

                <h2>⚡ Shri Shiv Enterprises</h2>

                <p>Website Administration</p>

            </div>


            <div class="sidebar-menu">

                <a href="dashboard.html">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🚗 Manage Products
                </a>

                <a href="enquiries.html">
                    📩 Enquiries
                </a>

                <a href="gallery.html" class="active">
                    🖼️ Gallery
                </a>

                <a href="festival.html">
                    🎉 Festival Updates
                </a>

                <a
                    href="../index.html"
                    target="_blank"
                >
                    🌐 View Website
                </a>

                <button
                    class="logout-btn"
                    onclick="logoutAdmin()"
                >
                    🚪 Logout
                </button>

            </div>

        </aside>



        <!-- ==================================================
             MAIN CONTENT
        ================================================== -->

        <main class="dashboard-main">


            <!-- HEADER -->

            <header class="dashboard-header">

                <div>

                    <h1>Gallery Management</h1>

                    <p>
                        Upload and manage images displayed
                        on your website.
                    </p>

                </div>


                <a
                    href="../index.html"
                    target="_blank"
                    class="header-btn"
                >
                    View Website
                </a>

            </header>



            <!-- ==================================================
                 ADD GALLERY IMAGE
            ================================================== -->

            <section class="dashboard-section">

                <h2>Add Gallery Image</h2>


                <form
                    id="galleryForm"
                    class="admin-form"
                >


                    <!-- IMAGE FILE -->

                    <label for="galleryImage">
                        Select Image
                    </label>


                    <input
                        type="file"
                        id="galleryImage"
                        accept="image/*"
                        required
                    >


                    <!-- IMAGE PREVIEW -->

                    <div
                        id="imagePreviewContainer"
                        style="
                            display: none;
                            margin-top: 15px;
                            margin-bottom: 15px;
                        "
                    >

                        <p>
                            Image Preview:
                        </p>


                        <img
                            id="imagePreview"
                            src=""
                            alt="Image Preview"
                            style="
                                width: 220px;
                                max-width: 100%;
                                height: auto;
                                border-radius: 10px;
                                border: 1px solid #ddd;
                                padding: 5px;
                            "
                        >

                    </div>



                    <!-- CAPTION -->

                    <label for="galleryCaption">
                        Image Caption
                    </label>


                    <input
                        type="text"
                        id="galleryCaption"
                        placeholder="Example: Super Metro E-Rickshaw"
                        required
                    >



                    <!-- ADD BUTTON -->

                    <button
                        type="submit"
                        class="save-btn"
                        id="addImageButton"
                    >
                        Add Image
                    </button>



                    <!-- STATUS -->

                    <p id="galleryStatus"></p>

                </form>

            </section>



            <!-- ==================================================
                 GALLERY LIST
            ================================================== -->

            <section class="dashboard-section">

                <h2>Gallery Images</h2>


                <div
                    id="galleryList"
                    class="gallery-admin-grid"
                ></div>

            </section>


        </main>

    </div>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>


        // ==================================================
        // ADMIN LOGIN CHECK
        // ==================================================

        const adminToken =
            localStorage.getItem("adminToken");


        if (!adminToken) {

            window.location.href =
                "login.html";

        }



        // ==================================================
        // LOGOUT
        // ==================================================

        function logoutAdmin() {

            localStorage.removeItem(
                "adminToken"
            );

            localStorage.removeItem(
                "adminUser"
            );

            window.location.href =
                "login.html";

        }



        // ==================================================
        // ELEMENTS
        // ==================================================

        const galleryForm =
            document.getElementById(
                "galleryForm"
            );


        const galleryList =
            document.getElementById(
                "galleryList"
            );


        const galleryStatus =
            document.getElementById(
                "galleryStatus"
            );


        const galleryImage =
            document.getElementById(
                "galleryImage"
            );


        const galleryCaption =
            document.getElementById(
                "galleryCaption"
            );


        const imagePreview =
            document.getElementById(
                "imagePreview"
            );


        const imagePreviewContainer =
            document.getElementById(
                "imagePreviewContainer"
            );


        const addImageButton =
            document.getElementById(
                "addImageButton"
            );



        // ==================================================
        // IMAGE PREVIEW
        // ==================================================

        galleryImage.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    imagePreviewContainer.style.display =
                        "none";

                    imagePreview.src = "";

                    return;

                }


                // Check image type

                if (!file.type.startsWith("image/")) {

                    alert(
                        "Please select an image file."
                    );

                    this.value = "";

                    imagePreviewContainer.style.display =
                        "none";

                    return;

                }


                // Show preview

                const imageURL =
                    URL.createObjectURL(file);


                imagePreview.src =
                    imageURL;


                imagePreviewContainer.style.display =
                    "block";

            }
        );



        // ==================================================
        // DISPLAY GALLERY
        // ==================================================

        async function displayGallery() {

            try {

                const response =
                    await fetch(
                        "https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch gallery"
                    );

                }


                const galleryItems =
                    await response.json();


                galleryList.innerHTML = "";


                if (
                    !galleryItems ||
                    galleryItems.length === 0
                ) {

                    galleryList.innerHTML =
                        "<p>No gallery images found.</p>";

                    return;

                }



                // Create cards

                galleryItems.forEach(
                    function (item) {

                        const galleryCard =
                            document.createElement(
                                "div"
                            );


                        galleryCard.className =
                            "gallery-admin-card";


                        galleryCard.innerHTML = `

                            <img
                                src="${item.image}"
                                alt="${item.caption}"
                                style="
                                    width: 100%;
                                    max-width: 300px;
                                    height: 200px;
                                    object-fit: cover;
                                    border-radius: 10px;
                                "
                            >

                            <h3>
                                ${item.caption}
                            </h3>

                            <button
                                class="delete-btn"
                                onclick="deleteGalleryImage('${item._id}')"
                            >
                                Delete
                            </button>

                        `;


                        galleryList.appendChild(
                            galleryCard
                        );

                    }
                );

            } catch (error) {

                console.error(
                    "Error loading gallery:",
                    error
                );


                galleryList.innerHTML =
                    "<p style='color:red;'>Failed to load gallery from server.</p>";

            }

        }



        // ==================================================
        // UPLOAD GALLERY IMAGE
        // ==================================================

        galleryForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const file =
                    galleryImage.files[0];


                const caption =
                    galleryCaption.value.trim();


                // Check file

                if (!file) {

                    galleryStatus.textContent =
                        "Please select an image.";

                    galleryStatus.style.color =
                        "red";

                    return;

                }


                // Check caption

                if (!caption) {

                    galleryStatus.textContent =
                        "Please enter an image caption.";

                    galleryStatus.style.color =
                        "red";

                    return;

                }



                // Disable button

                addImageButton.disabled =
                    true;


                addImageButton.textContent =
                    "Uploading...";


                galleryStatus.textContent =
                    "Uploading image...";


                galleryStatus.style.color =
                    "#087f8c";



                try {


                    // ==================================================
                    // FORM DATA
                    // ==================================================

                    const formData =
                        new FormData();


                    formData.append(
                        "image",
                        file
                    );


                    formData.append(
                        "caption",
                        caption
                    );



                    // ==================================================
                    // SEND TO BACKEND
                    // ==================================================

                    const response =
                        await fetch(
                            "https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery",
                            {
                                method: "POST",

                                headers: {
                                    Authorization:
                                        `Bearer ${adminToken}`
                                },

                                body: formData
                            }
                        );



                    const data =
                        await response.json();



                    if (response.ok) {


                        galleryStatus.textContent =
                            "Image uploaded successfully!";

                        galleryStatus.style.color =
                            "green";


                        // Reset form

                        galleryForm.reset();


                        // Hide preview

                        imagePreview.src =
                            "";

                        imagePreviewContainer.style.display =
                            "none";


                        // Reload gallery

                        displayGallery();


                    } else {


                        galleryStatus.textContent =
                            data.message ||
                            "Failed to upload image.";

                        galleryStatus.style.color =
                            "red";

                    }


                } catch (error) {


                    console.error(
                        "Upload Error:",
                        error
                    );


                    galleryStatus.textContent =
                        "Server error while uploading image.";

                    galleryStatus.style.color =
                        "red";


                } finally {


                    addImageButton.disabled =
                        false;


                    addImageButton.textContent =
                        "Add Image";

                }

            }
        );



        // ==================================================
        // DELETE GALLERY IMAGE
        // ==================================================

        async function deleteGalleryImage(id) {


            const confirmation =
                confirm(
                    "Are you sure you want to delete this image?"
                );


            if (!confirmation) {

                return;

            }



            try {


                const response =
                    await fetch(
                        `https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                Authorization:
                                    `Bearer ${adminToken}`
                            }
                        }
                    );



                const data =
                    await response.json();



                if (response.ok) {


                    displayGallery();


                } else {


                    alert(
                        data.message ||
                        "Failed to delete image."
                    );

                }


            } catch (error) {


                console.error(
                    "Delete Error:",
                    error
                );


                alert(
                    "Server error while deleting image."
                );

            }

        }



        // ==================================================
        // INITIAL LOAD
        // ==================================================

        displayGallery();

    </script>

</body>

</html>
