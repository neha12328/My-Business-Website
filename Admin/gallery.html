<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body class="dashboard-page">

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <h2>⚡ Shri Shiv Enterprises</h2>
                <p>Website Administration</p>
            </div>

            <div class="sidebar-menu">

                <a href="dashboard.html">
                    📊 Dashboard
                </a>

                <a href="products.html">
                    🚗 Manage Products
                </a>

                <a href="enquiries.html">
                    📩 Enquiries
                </a>

                <a href="gallery.html" class="active">
                    🖼️ Gallery
                </a>

                <a href="festival.html">
                    🎉 Festival Updates
                </a>

                <a href="../index.html" target="_blank">
                    🌐 View Website
                </a>

                <button class="logout-btn" onclick="logoutAdmin()">
                    🚪 Logout
                </button>

            </div>

        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">

            <header class="dashboard-header">

                <div>
                    <h1>Gallery Management</h1>
                    <p>Manage images displayed on your website.</p>
                </div>

                <a href="../index.html" target="_blank" class="header-btn">
                    View Website
                </a>

            </header>

            <section class="dashboard-section">

                <h2>Add Gallery Image</h2>

                <form id="galleryForm" class="admin-form">

                    <label for="galleryImage">
                        Image File Name
                    </label>

                    <input
                        type="text"
                        id="galleryImage"
                        placeholder="Example: Blue colour.png"
                        required
                    >

                    <label for="galleryCaption">
                        Image Caption
                    </label>

                    <input
                        type="text"
                        id="galleryCaption"
                        placeholder="Example: Super Metro E-Rickshaw"
                        required
                    >

                    <button type="submit" class="save-btn">
                        Add Image
                    </button>

                    <p id="galleryStatus"></p>

                </form>

            </section>

            <section class="dashboard-section">

                <h2>Gallery Images</h2>

                <div id="galleryList" class="gallery-admin-grid"></div>

            </section>

        </main>

    </div>

    <script>
        const adminToken = localStorage.getItem("adminToken");
        if (!adminToken) {
            window.location.href = "login.html";
        }

        function logoutAdmin() {
            localStorage.removeItem("adminToken");
            localStorage.removeItem("adminUser");
            window.location.href = "login.html";
        }

        const galleryForm = document.getElementById("galleryForm");
        const galleryList = document.getElementById("galleryList");
        const galleryStatus = document.getElementById("galleryStatus");

        // Fetch and display gallery images from MongoDB
        async function displayGallery() {
            try {
                const response = await fetch("https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery");
                const galleryItems = await response.json();

                galleryList.innerHTML = "";

                if (galleryItems.length === 0) {
                    galleryList.innerHTML = "<p>No gallery images found in database.</p>";
                    return;
                }

                galleryItems.forEach(function (item) {
                    const galleryCard = document.createElement("div");
                    galleryCard.className = "gallery-admin-card";

                    galleryCard.innerHTML = `
                        <img
                            src="../images/${item.image}"
                            alt="${item.caption}"
                            onerror="this.style.display='none'"
                        >
                        <h3>${item.caption}</h3>
                        <p>${item.image}</p>
                        <button
                            class="delete-btn"
                            onclick="deleteGalleryImage('${item._id}')">
                            Delete
                        </button>
                    `;

                    galleryList.appendChild(galleryCard);
                });
            } catch (error) {
                console.error("Error loading gallery:", error);
                galleryList.innerHTML = "<p style='color: red;'>Failed to load gallery from server.</p>";
            }
        }

        // Add new gallery image to MongoDB
        galleryForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const newImage = {
                image: document.getElementById("galleryImage").value,
                caption: document.getElementById("galleryCaption").value
            };

            try {
                const response = await fetch("https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(newImage)
                });

                if (response.ok) {
                    galleryForm.reset();
                    galleryStatus.textContent = "Gallery image added to Database successfully!";
                    galleryStatus.style.color = "green";
                    displayGallery();
                } else {
                    galleryStatus.textContent = "Failed to add image.";
                    galleryStatus.style.color = "red";
                }
            } catch (error) {
                console.error("Save Error:", error);
                galleryStatus.textContent = "Server error while saving.";
                galleryStatus.style.color = "red";
            }
        });

        // Delete gallery image from MongoDB using its ID
        async function deleteGalleryImage(id) {
            const confirmation = confirm("Are you sure you want to delete this image from database?");

            if (confirmation) {
                try {
                    const response = await fetch(`https://shri-shiv-enterprises-backened.onrender.com/api/admin/gallery/${id}`, {
                        method: "DELETE"
                    });

                    if (response.ok) {
                        displayGallery();
                    } else {
                        alert("Failed to delete image.");
                    }
                } catch (error) {
                    console.error("Delete Error:", error);
                    alert("Server error while deleting.");
                }
            }
        }

        // Initial load
        displayGallery();
    </script>

</body>
</html>
